<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <main id="main">
    <h1>Task Manager</h1>

    <div id="liveStatus" class="sr-only" role="status" aria-live="polite"></div>

    <div id="toast" class="toast" role="alert" hidden>
      <span id="toastMessage"></span>
      <button type="button" id="toastRetry" hidden>Retry</button>
      <button type="button" id="toastDismiss" aria-label="Dismiss error message">Dismiss</button>
    </div>

    <section class="controls" aria-label="Search, filter and sort">
      <label for="search">Search</label>
      <input id="search" type="search" placeholder="Search title..." />

      <label for="statusFilter">Status</label>
      <select id="statusFilter">
        <option value="">All</option>
        <option value="todo">To Do</option>
        <option value="in_progress">In Progress</option>
        <option value="done">Done</option>
      </select>

      <label for="priorityFilter">Priority</label>
      <select id="priorityFilter">
        <option value="">All</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <label for="tagFilter">Tag</label>
      <input id="tagFilter" type="search" placeholder="Filter by tag..." />

      <label for="showArchived">
        <input id="showArchived" type="checkbox" /> Show archived
      </label>

      <label for="sortBy">Sort by</label>
      <select id="sortBy">
        <option value="created_at">Created</option>
        <option value="due_date">Due date</option>
        <option value="priority">Priority</option>
      </select>

      <label for="sortDir">Direction</label>
      <select id="sortDir">
        <option value="asc">Asc</option>
        <option value="desc">Desc</option>
      </select>
    </section>

    <form id="addForm" aria-label="Add a task" novalidate>
      <label for="title">Title</label>
      <input id="title" name="title" type="text" required aria-required="true" maxlength="200" aria-describedby="titleError" />
      <p id="titleError" class="field-error" role="alert" hidden></p>

      <label for="description">Description</label>
      <input id="description" name="description" type="text" maxlength="2000" />

      <label for="dueDate">Due date</label>
      <input id="dueDate" name="due_date" type="date" />

      <label for="tags">Tags</label>
      <input id="tags" name="tags" type="text" placeholder="comma, separated" />

      <label for="priority">Priority</label>
      <select id="priority" name="priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>

      <button type="submit">Add task</button>
    </form>

    <ul id="taskList" aria-label="Tasks" tabindex="-1"></ul>
    <p id="emptyState" role="status" hidden>No tasks match your search/filters.</p>

    <nav id="pager" class="pager" aria-label="Pagination" hidden>
      <button type="button" id="prevPage">Previous</button>
      <span id="pageInfo" aria-live="polite"></span>
      <button type="button" id="nextPage">Next</button>
      <label for="pageSize">Per page</label>
      <select id="pageSize">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="25">25</option>
        <option value="50">50</option>
      </select>
    </nav>
  </main>

  <template id="taskRowTemplate">
    <li class="task-row">
      <input type="checkbox" class="task-done-toggle" />
      <span class="task-title"></span>
      <span class="task-description"></span>
      <span class="task-status"></span>
      <span class="task-priority"></span>
      <span class="task-tags"></span>
      <span class="task-due"></span>
      <button type="button" class="btn-edit">Edit</button>
      <button type="button" class="btn-advance"></button>
      <button type="button" class="btn-archive">Archive</button>
      <button type="button" class="btn-restore">Restore</button>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
